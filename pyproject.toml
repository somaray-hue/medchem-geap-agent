[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medchem-geap-agent"
version = "0.1.0"
description = "Enterprise Life Sciences Medicinal Chemistry Agent built on Google ADK, Gemini Enterprise Agent Platform (GEAP), and Google DeepMind Cheminformatics Skills + TxGemma."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.15.0",
    "google-genai>=2.0.0",
    "rdkit>=2025.9.1",
    "pydantic>=2.10.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "google-cloud-secret-manager>=2.21.0",
    "google-cloud-dlp>=3.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["medchem_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "eval"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
